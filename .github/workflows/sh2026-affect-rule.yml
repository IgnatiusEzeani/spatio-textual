name: SH2026 affect rule benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affect-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEV_SHA256: 76844f4ea2febfe665b1f98abd938ef2176bca4e8d6ef6407f63f95100fb3529
      HOLDOUT_SHA256: 7f5007218934855e1c5e6cd941c8099ca855d70a85819e569837e8da6b85cd4d
      SH2026_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build and verify frozen affect corpora
        run: |
          python benchmarks/sh2026/build_affect_v1.py
          test "$(sha256sum benchmarks/sh2026/affect_dev_v1.jsonl | cut -d' ' -f1)" = "$DEV_SHA256"
          test "$(sha256sum benchmarks/sh2026/affect_holdout_v1.jsonl | cut -d' ' -f1)" = "$HOLDOUT_SHA256"
          wc -l benchmarks/sh2026/affect_dev_v1.jsonl benchmarks/sh2026/affect_holdout_v1.jsonl

      - name: Verify corpus schema and counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path, expected in [
              (Path('benchmarks/sh2026/affect_dev_v1.jsonl'), 80),
              (Path('benchmarks/sh2026/affect_holdout_v1.jsonl'), 48),
          ]:
              rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
              assert len(rows) == expected
              assert len({r['example_id'] for r in rows}) == expected
              for r in rows:
                  assert r['schema_version'] == 'sh2026-affect-reference-v1'
                  assert r['source']['public_safe'] is True
                  assert r['sentiment_label'] in {'positive','negative','neutral','mixed'}
                  assert set(r['emotion_labels']) <= {'fear','sadness','anger','joy','anxiety','despair','gratitude','surprise'}
          print('Affect corpus validation passed.')
          PY

      - name: Run transparent rule baseline on development set
        run: |
          python scripts/run_sh2026_affect_rule.py \
            benchmarks/sh2026/affect_dev_v1.jsonl \
            --out-dir sh2026_outputs/affect_rule/dev

      - name: Run frozen rule baseline on formal holdout
        run: |
          python scripts/run_sh2026_affect_rule.py \
            benchmarks/sh2026/affect_holdout_v1.jsonl \
            --benchmark-mode \
            --frozen-at-commit "$SH2026_HEAD_SHA" \
            --expected-sha256 "$HOLDOUT_SHA256" \
            --out-dir sh2026_outputs/affect_rule/holdout
          cat sh2026_outputs/affect_rule/holdout/affect_summary.json

      - name: Record corpus provenance
        run: |
          cat > sh2026_outputs/affect_rule/corpus_manifest.json <<EOF
          {
            "schema_version": "sh2026-affect-corpus-manifest-v1",
            "development_examples": 80,
            "holdout_examples": 48,
            "development_sha256": "$DEV_SHA256",
            "holdout_sha256": "$HOLDOUT_SHA256",
            "source_type": "instructor_authored_synthetic_public_safe",
            "commit": "$SH2026_HEAD_SHA",
            "first_holdout_run": "34579117306",
            "holdout_note": "The v1 rule implementation was committed before first holdout execution and was not tuned after observing holdout results. This workflow reruns the identical condition with formal benchmark guards."
          }
          EOF
          cat sh2026_outputs/affect_rule/corpus_manifest.json

      - name: Upload affect rule artefact
        uses: actions/upload-artifact@v4
        with:
          name: sh2026-affect-rule-${{ github.run_id }}
          path: |
            benchmarks/sh2026/affect_dev_v1.jsonl
            benchmarks/sh2026/affect_holdout_v1.jsonl
            sh2026_outputs/affect_rule/
            docs/sh2026/AFFECT_EXPERIMENT_V1.md
          if-no-files-found: error
          retention-days: 30
