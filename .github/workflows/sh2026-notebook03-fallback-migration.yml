name: SH2026 Notebook 03 fallback migration

on:
  pull_request:
    paths:
      - "projects/sh2026/demo/ner_transformer_teaching_fallback_v1.json"
      - "projects/sh2026/scripts/patch_notebook03_ner_fallback.py"
      - ".github/workflows/sh2026-notebook03-fallback-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch Notebook 03
        run: python projects/sh2026/scripts/patch_notebook03_ner_fallback.py

      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('projects/sh2026/workshop/03_contextual_ner.ipynb')
          nb = json.loads(p.read_text(encoding='utf-8'))
          text = json.dumps(nb)
          assert 'ner_transformer_teaching_fallback_v1.json' in text
          assert 'precomputed revision-pinned Hugging Face fallback' in text
          assert 'revision=\\"0b95561fd0c304538b5eb8a0ee532ca24dd009b9\\"' in text
          print('Notebook 03 fallback migration validated')
          PY

      - name: Commit migration if needed
        run: |
          if git diff --quiet -- projects/sh2026/workshop/03_contextual_ner.ipynb; then
            echo "Notebook already migrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/sh2026/workshop/03_contextual_ner.ipynb
          git commit -m "docs(sh2026): wire Notebook 03 to pinned NER fallback"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
