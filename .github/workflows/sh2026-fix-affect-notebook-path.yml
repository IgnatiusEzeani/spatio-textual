name: SH2026 fix affect notebook repo path

on:
  push:
    branches:
      - spatial-humanities-2026-cleanup-work
    paths:
      - ".github/workflows/sh2026-fix-affect-notebook-path.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spatial-humanities-2026-cleanup-work
      - name: Patch Notebook 05 setup cell
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("projects/sh2026/workshop/05_affect_and_events.ipynb")
          nb = json.loads(path.read_text(encoding="utf-8"))
          replacement = [
              "# Independent Colab/CI setup.\n",
              "import os, sys, json, subprocess, pathlib\n",
              "\n",
              "REPO = \"https://github.com/IgnatiusEzeani/spatio-textual.git\"\n",
              "BRANCH = \"spatial-humanities-2026\"\n",
              "\n",
              "cwd = pathlib.Path.cwd()\n",
              "if (cwd / \"spatio_textual\").exists() and (cwd / \"projects\" / \"sh2026\").exists():\n",
              "    repo_dir = cwd\n",
              "elif pathlib.Path(\"/content/spatio-textual\").exists():\n",
              "    repo_dir = pathlib.Path(\"/content/spatio-textual\").resolve()\n",
              "else:\n",
              "    repo_dir = pathlib.Path(\"spatio-textual\").resolve()\n",
              "    if not repo_dir.exists():\n",
              "        subprocess.run([\"git\", \"clone\", \"--depth\", \"1\", \"--branch\", BRANCH, REPO, str(repo_dir)], check=True)\n",
              "\n",
              "os.chdir(repo_dir)\n",
              "subprocess.run([sys.executable, \"-m\", \"pip\", \"install\", \"-q\", \"-e\", \".\"], check=True)\n",
              "\n",
              "FAST_MODE = True\n",
              "print(\"Repository:\", repo_dir)\n",
              "print(\"Ready. FAST_MODE =\", FAST_MODE)\n",
          ]
          found = False
          for cell in nb.get("cells", []):
              src = cell.get("source", [])
              text = "".join(src) if isinstance(src, list) else str(src)
              if cell.get("cell_type") == "code" and "# Independent Colab setup." in text:
                  cell["source"] = replacement
                  found = True
                  break
          if not found:
              raise SystemExit("Notebook 05 setup cell not found")
          path.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
          PY
      - name: Commit notebook fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/sh2026/workshop/05_affect_and_events.ipynb
          if git diff --cached --quiet; then
            echo "No notebook change required"
          else
            git commit -m "fix(sh2026): make affect notebook resolve repository root"
            git push origin HEAD:spatial-humanities-2026-cleanup-work
          fi
