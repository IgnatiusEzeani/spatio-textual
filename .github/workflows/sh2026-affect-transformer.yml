name: SH2026 affect transformer benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affect-transformer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEV_SHA256: 76844f4ea2febfe665b1f98abd938ef2176bca4e8d6ef6407f63f95100fb3529
      HOLDOUT_SHA256: 7f5007218934855e1c5e6cd941c8099ca855d70a85819e569837e8da6b85cd4d
      SENTIMENT_MODEL: cardiffnlp/twitter-roberta-base-sentiment-latest
      SENTIMENT_REVISION: 3216a57f2a0d9c45a2e6c20157c20c49fb4bf9c7
      EMOTION_MODEL: j-hartmann/emotion-english-distilroberta-base
      EMOTION_REVISION: 0e1cd914e3d46199ed785853e12b57304e04178b
      SH2026_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face affect models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: sh2026-affect-transformer-${{ runner.os }}-${{ env.SENTIMENT_REVISION }}-${{ env.EMOTION_REVISION }}

      - name: Install transformer affect environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e '.[transformers]'
          mkdir -p sh2026_outputs/affect_transformer/dev
          mkdir -p sh2026_outputs/affect_transformer/holdout
          python -m pip freeze > sh2026_outputs/affect_transformer/python_environment.txt
          python --version > sh2026_outputs/affect_transformer/python_version.txt

      - name: Build and verify frozen affect corpora
        run: |
          python benchmarks/sh2026/build_affect_v1.py
          test "$(sha256sum benchmarks/sh2026/affect_dev_v1.jsonl | cut -d' ' -f1)" = "$DEV_SHA256"
          test "$(sha256sum benchmarks/sh2026/affect_holdout_v1.jsonl | cut -d' ' -f1)" = "$HOLDOUT_SHA256"

      - name: Verify pinned Hugging Face revisions resolve exactly
        run: |
          python - <<'PY'
          from huggingface_hub import model_info
          import os
          for model_env, revision_env in [
              ('SENTIMENT_MODEL', 'SENTIMENT_REVISION'),
              ('EMOTION_MODEL', 'EMOTION_REVISION'),
          ]:
              model = os.environ[model_env]
              revision = os.environ[revision_env]
              info = model_info(model, revision=revision)
              assert info.sha == revision, (model, info.sha, revision)
              print(model, info.sha)
          PY

      - name: Run frozen transformer condition on development set
        run: |
          python scripts/run_sh2026_affect_transformer.py \
            benchmarks/sh2026/affect_dev_v1.jsonl \
            --out-dir sh2026_outputs/affect_transformer/dev

      - name: Run first formal transformer affect holdout
        run: |
          python scripts/run_sh2026_affect_transformer.py \
            benchmarks/sh2026/affect_holdout_v1.jsonl \
            --benchmark-mode \
            --frozen-at-commit "$SH2026_HEAD_SHA" \
            --expected-sha256 "$HOLDOUT_SHA256" \
            --out-dir sh2026_outputs/affect_transformer/holdout
          cat sh2026_outputs/affect_transformer/holdout/affect_summary.json

      - name: Record frozen transformer condition
        run: |
          cat > sh2026_outputs/affect_transformer/condition_manifest.json <<EOF
          {
            "schema_version": "sh2026-affect-transformer-condition-v1",
            "sentiment_model": "$SENTIMENT_MODEL",
            "sentiment_revision": "$SENTIMENT_REVISION",
            "emotion_model": "$EMOTION_MODEL",
            "emotion_revision": "$EMOTION_REVISION",
            "development_sha256": "$DEV_SHA256",
            "holdout_sha256": "$HOLDOUT_SHA256",
            "evaluation_commit": "$SH2026_HEAD_SHA",
            "mixed_min_probability": 0.25,
            "mixed_max_gap": 0.20,
            "emotion_threshold": 0.25,
            "emotion_top_fallback": 0.50,
            "representable_emotions": ["anger", "fear", "joy", "sadness", "surprise"],
            "unsupported_sh2026_emotions": ["anxiety", "despair", "gratitude"],
            "freeze_note": "Models, revisions, ontology mapping and thresholds were documented before first formal holdout scoring."
          }
          EOF

      - name: Upload transformer affect artefact
        uses: actions/upload-artifact@v4
        with:
          name: sh2026-affect-transformer-${{ github.run_id }}
          path: |
            sh2026_outputs/affect_transformer/
            docs/sh2026/AFFECT_EXPERIMENT_V1.md
            docs/sh2026/AFFECT_TRANSFORMER_CONDITION_V1.md
          if-no-files-found: error
          retention-days: 30
